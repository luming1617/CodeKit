interface:
  display_name: "后端发布方案（RPD）"
  short_description: "基于 PRD 与 TDD 生成可执行的发布、验证与回滚方案"
  default_prompt: "使用 $release-doc，参数传当前需求目录 <feature-directory>（必须已包含 product-doc.md 与 technical-doc.md），依次调度依赖解析、Runbook 生成、故障模拟审查、定向补全与独立评审，产出 release-doc.md；不得执行真实发布或外部变更。面向用户的回报从第一句起全程使用简体中文，代码、命令、路径与状态字面量保持原文。"
